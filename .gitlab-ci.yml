stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: "unix:///var/run/docker.sock"
  GIT_CLEAN_FLAGS: -ffdx

.build_template:
  stage: build
  image: docker:25
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - docker compose build

.deploy_template:
  stage: deploy
  image: docker:25
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    # creds.json — Google service-account (gitignore'да, -ffdx uni o'chiradi).
    # File-type CI/CD variable GOOGLE_CREDENTIALS dan faylga yozamiz, aks holda
    # bind-mount bo'sh PAPKA yaratadi ("Is a directory: /app/creds.json").
    - if [ -n "$GOOGLE_CREDENTIALS" ]; then rm -rf ./creds.json && cp "$GOOGLE_CREDENTIALS" ./creds.json; fi
    - docker compose up -d --wait --force-recreate
    - docker image prune -f

build-prod:
  extends: .build_template
  tags: [wfm_prod]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-prod:
  extends: .deploy_template
  tags: [wfm_prod]
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build-dev:
  extends: .build_template
  tags: [wfm_dev]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy-dev:
  extends: .deploy_template
  tags: [wfm_dev]
  environment:
    name: development
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

# ⚠️ ОПАСНО: полностью очищает PROD (тома + БД). Запускается ТОЛЬКО вручную
# из GitLab UI на ветке main. Порядок для чистого релиза:
#   1) задать CI/CD Variables (DB_NAME=wc_system_prod и т.д.)
#   2) merge dev -> main (push) — прогонятся build/deploy
#   3) вручную запустить clean-prod-db (down -v — том БД удаляется)
#   4) вручную перезапустить (retry) deploy-prod — up создаст свежие БД
#      (init-databases.sql -> wc_system_prod + wc_system_prod_archive) и мигрирует
clean-prod-db:
  stage: deploy
  image: docker:25
  tags: [wfm_prod]
  environment:
    name: production
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - docker compose down -v